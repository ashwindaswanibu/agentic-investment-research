name: researchdesk

services:
  db:
    image: postgres:17@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: researchdesk
      POSTGRES_DB: researchdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env; no default password is supplied}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchdesk -d researchdesk"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
      target: api
    environment:
      RESEARCHDESK_DATABASE_URL: postgresql+psycopg://researchdesk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/researchdesk
      RESEARCHDESK_READ_ONLY: ${RESEARCHDESK_READ_ONLY:-true}
      RESEARCHDESK_OPERATOR_TOKEN: ${RESEARCHDESK_OPERATOR_TOKEN:-}
      # The worker owns model credentials; a fresh worker publishes readiness.
      RESEARCHDESK_PROVIDER: disabled
      RESEARCHDESK_ALLOWED_ORIGINS: ${RESEARCHDESK_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      RESEARCHDESK_RETRIEVAL_MODE: ${RESEARCHDESK_RETRIEVAL_MODE:-lexical}
      RESEARCHDESK_ARTIFACT_DIR: /tmp/researchdesk-artifacts
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8010"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      RESEARCH_API_URL: http://api:8010
      RESEARCH_ALLOWED_ORIGINS: ${RESEARCH_ALLOWED_ORIGINS:-}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
      target: worker
    # The socket grants daemon-level control. Only a trusted operator may run this service.
    user: "0:0"
    environment:
      RESEARCHDESK_DATABASE_URL: postgresql+psycopg://researchdesk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/researchdesk
      RESEARCHDESK_READ_ONLY: ${RESEARCHDESK_READ_ONLY:-true}
      RESEARCHDESK_PROVIDER: ${RESEARCHDESK_PROVIDER:-disabled}
      RESEARCHDESK_MODEL: ${RESEARCHDESK_MODEL:-}
      RESEARCHDESK_OPENAI_API_KEY: ${RESEARCHDESK_OPENAI_API_KEY:-}
      RESEARCHDESK_TRADIER_SANDBOX_TOKEN: ${RESEARCHDESK_TRADIER_SANDBOX_TOKEN:-}
      RESEARCHDESK_PROVIDER_TIMEOUT_SECONDS: ${RESEARCHDESK_PROVIDER_TIMEOUT_SECONDS:-120}
      RESEARCHDESK_MAX_TURNS: ${RESEARCHDESK_MAX_TURNS:-20}
      RESEARCHDESK_SANDBOX_IMAGE: ${RESEARCHDESK_SANDBOX_IMAGE:-researchdesk-sandbox:local}
      RESEARCHDESK_SANDBOX_TIMEOUT_SECONDS: ${RESEARCHDESK_SANDBOX_TIMEOUT_SECONDS:-20}
      RESEARCHDESK_RETRIEVAL_MODE: ${RESEARCHDESK_RETRIEVAL_MODE:-lexical}
      RESEARCHDESK_ARTIFACT_DIR: /tmp/researchdesk-artifacts
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 150s
    restart: "no"

  paper-worker:
    profiles: [paper]
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
      target: api
    command: ["paper-worker"]
    healthcheck:
      disable: true
    environment:
      RESEARCHDESK_DATABASE_URL: postgresql+psycopg://researchdesk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/researchdesk
      RESEARCHDESK_READ_ONLY: ${RESEARCHDESK_READ_ONLY:-true}
      RESEARCHDESK_PROVIDER: disabled
      RESEARCHDESK_ALPACA_API_KEY: ${RESEARCHDESK_ALPACA_API_KEY:-}
      RESEARCHDESK_ALPACA_SECRET_KEY: ${RESEARCHDESK_ALPACA_SECRET_KEY:-}
      RESEARCHDESK_ALPACA_FEED: ${RESEARCHDESK_ALPACA_FEED:-iex}
      RESEARCHDESK_ARTIFACT_DIR: /tmp/researchdesk-artifacts
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
