name: Validate research workbench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: researchdesk_ci
          POSTGRES_DB: researchdesk_ci
          # Disposable CI service only; never a deployment credential.
          POSTGRES_PASSWORD: disposable-ci-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U researchdesk_ci -d researchdesk_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, official ref verified 2026-10-05
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install constrained dependencies
        run: python -m pip install -c requirements.lock '.[dev,retrieval]'
      - name: Lint and format
        run: |
          ruff check src tests examples deploy
          ruff format --check src tests examples deploy
      - name: Deterministic unit and API tests
        run: pytest -q -m 'not live and not sandbox and not integration'
      - name: Real PostgreSQL concurrency and recovery
        env:
          RESEARCHDESK_TEST_DATABASE_URL: postgresql+psycopg://researchdesk_ci:disposable-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/researchdesk_ci
        run: pytest -q tests/test_postgres.py tests/test_paper_operations_postgres.py
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RESEARCHDESK_SANDBOX_IMAGE: researchdesk-sandbox:ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock '.[dev,retrieval]'
      - name: Validate deployment manifest
        env:
          POSTGRES_PASSWORD: disposable-compose-validation-only
        run: docker compose config --quiet
      - name: Build isolated Python image
        run: docker build -f deploy/sandbox.Dockerfile -t "$RESEARCHDESK_SANDBOX_IMAGE" .
      - name: Assert Docker readiness (do not silently skip this job)
        run: |
          python - <<'PY'
          import os
          from researchdesk.sandbox import DockerSandbox
          readiness = DockerSandbox(image=os.environ['RESEARCHDESK_SANDBOX_IMAGE']).availability()
          assert readiness['available'], readiness['reason']
          PY
      - name: Real isolation, cancellation, recovery and generated-policy tests
        run: pytest -q tests/test_sandbox.py tests/test_domain.py tests/test_generated_tools.py -m sandbox

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  public-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the actual Python and Next demo image
        run: docker build -f deploy/public-demo.Dockerfile -t researchdesk-public-demo:ci .
      - name: Qualify constrained runtime, read-only behavior and process failures
        run: python3 examples/public_demo_container_check.py --image researchdesk-public-demo:ci --output artifacts/public-demo-container.json
      - name: Retain container qualification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: public-demo-container
          path: artifacts/public-demo-container.json
          if-no-files-found: warn
          retention-days: 14
